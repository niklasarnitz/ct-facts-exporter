name: Image

# Builds the production image on every push to master (as Coolify did), pushes it to GHCR and pins the new
# tag in niklasarnitz/ops (stacks/ct-facts-exporter/compose.yaml). The push to ops triggers the Komodo deployment.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: image-master
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/niklasarnitz/ct-facts-exporter

jobs:
  build:
    # delta is arm64; build natively instead of emulating.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:master
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: niklasarnitz/ops
          ssh-key: ${{ secrets.OPS_DEPLOY_KEY }}

      - name: Pin image tag in ops
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          file=stacks/ct-facts-exporter/compose.yaml
          if [ ! -f "$file" ]; then
            echo "$file does not exist yet; nothing to pin"
            exit 0
          fi
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]+#\1:${TAG}#" "$file"
          grep -q "image: ${IMAGE}:${TAG}" "$file"
          if git diff --quiet; then
            echo "Tag already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ct-facts-exporter: deploy ${TAG}" -m "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
